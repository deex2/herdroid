name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable action revision
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: cargo fmt --manifest-path bridge/Cargo.toml --check
      - run: cargo clippy --manifest-path bridge/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path bridge/Cargo.toml --locked
      - run: cargo build --manifest-path bridge/Cargo.toml --locked --release --target ${{ matrix.target }}
      - shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "scripts/package-bridge.ps1"
          $binary = Join-Path $env:GITHUB_WORKSPACE "bridge/target/${{ matrix.target }}/release/herdroid-bridge${{ matrix.target == 'x86_64-pc-windows-msvc' && '.exe' || '' }}"
          $output = Join-Path $env:GITHUB_WORKSPACE "build/bridge-artifacts"
          & $script -Target ${{ matrix.target }} -Binary $binary -Output $output
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bridge-${{ matrix.target }}
          path: |
            build/bridge-artifacts/${{ matrix.target }}/herdr-plugin.toml
            build/bridge-artifacts/${{ matrix.target }}/bin/
            build/bridge-artifacts/catalog.json
            THIRD_PARTY_NOTICES.md

  android:
    needs: bridge
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17.0.20+8'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bridge-*
          path: build/downloaded-bridge-artifacts
      - shell: pwsh
        run: |
          $targets = @(
            "x86_64-unknown-linux-gnu",
            "aarch64-unknown-linux-gnu",
            "x86_64-pc-windows-msvc"
          )
          foreach ($target in $targets) {
            $suffix = if ($target -eq "x86_64-pc-windows-msvc") { ".exe" } else { "" }
            $binary = Join-Path $env:GITHUB_WORKSPACE "build/downloaded-bridge-artifacts/bridge-$target/build/bridge-artifacts/$target/bin/herdroid-bridge$suffix"
            & pwsh -NoProfile -File "$env:GITHUB_WORKSPACE/scripts/package-bridge.ps1" `
              -Target $target `
              -Binary $binary `
              -Output "$env:GITHUB_WORKSPACE/build/bridge-artifacts"
          }
      - name: Prepare release signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
          HERDROID_SIGNING_KEY_BASE64: ${{ secrets.HERDROID_SIGNING_KEY_BASE64 }}
          HERDROID_SIGNING_PASSWORD: ${{ secrets.HERDROID_SIGNING_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HERDROID_SIGNING_KEY_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:HERDROID_SIGNING_PASSWORD)) {
            throw "Release signing secrets are unavailable"
          }
          $build = Get-Content -Raw "$env:GITHUB_WORKSPACE/app/build.gradle.kts"
          if ($build -notmatch 'versionName\s*=\s*"([^"]+)"' -or $env:TAG_NAME -ne "v$($Matches[1])") {
            throw "Tag $env:TAG_NAME does not match the Android version"
          }
          $store = Join-Path $env:RUNNER_TEMP "herdroid-release.p12"
          [IO.File]::WriteAllBytes($store, [Convert]::FromBase64String($env:HERDROID_SIGNING_KEY_BASE64))
          "HERDROID_SIGNING_STORE_FILE=$store" >> $env:GITHUB_ENV
      - name: Build and test Android app
        env:
          HERDROID_SIGNING_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.HERDROID_SIGNING_PASSWORD || '' }}
        run: .\gradlew.bat --dependency-verification strict -PbridgeArtifactDir=build/bridge-artifacts clean testDebugUnitTest test lintDebug lint assembleDebug assembleDebugAndroidTest assembleRelease --no-daemon
      - name: Remove release key
        if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP "herdroid-release.p12") -Force -ErrorAction SilentlyContinue
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        run: ./scripts/verify-bridge-apk.ps1 -Apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Verify signed release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $apk = "$env:GITHUB_WORKSPACE/app/build/outputs/apk/release/app-release.apk"
          ./scripts/verify-bridge-apk.ps1 -Apk $apk
          $apksigner = Get-ChildItem "$env:ANDROID_HOME/build-tools" -Filter apksigner.bat -Recurse |
            Sort-Object { [version]$_.Directory.Name } -Descending |
            Select-Object -First 1
          if ($null -eq $apksigner) { throw "apksigner is unavailable" }
          $output = & $apksigner.FullName verify --verbose --print-certs $apk 2>&1
          if ($LASTEXITCODE -ne 0) { throw ($output -join [Environment]::NewLine) }
          $match = $output | Select-String 'certificate SHA-256 digest:\s*([0-9a-fA-F]{64})' | Select-Object -First 1
          if ($null -eq $match) { throw "Release certificate digest is unavailable" }
          $digest = $match.Matches[0].Groups[1].Value
          $expected = "b0c9df1f4688879f830d3e41811ff76486eb5c00e8998ab1cde8b338ad131770"
          if ($digest.ToLowerInvariant() -ne $expected) { throw "Unexpected release certificate: $digest" }
          $name = "herdroid-$env:TAG_NAME.apk"
          $release = New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/build/release"
          Copy-Item $apk (Join-Path $release $name)
          $hash = (Get-FileHash (Join-Path $release $name) -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content (Join-Path $release "$name.sha256")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apks
          path: app/build/outputs/apk/
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: build/release/

  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG_NAME"
          "release/herdroid-$TAG_NAME.apk"
          "release/herdroid-$TAG_NAME.apk.sha256"
          --verify-tag --prerelease --latest=false --generate-notes
          --title "Herdroid $TAG_NAME"
