[package]
name = "herdroid-bridge"
version = "0.1.0"
edition = "2024"

[dependencies]
interprocess = "=2.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes"] }
